version: '3.8'

services:
  docker-in-docker:
    image: docker:dind
    container_name: 'docker_dind'
    privileged: 'true'
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    restart: 'unless-stopped'

  runner:
    image: 'data.forgejo.org/forgejo/runner:13'
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_started
    container_name: 'runner'
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    # User without root privileges, but with access to `./data`.
    user: 1000:1000
    configs:
      - source: runner_config
        target: data/runner-config.yml
    volumes:
      - forgejo_runner_data:/data
    restart: 'unless-stopped'
    command: 'forgejo-runner daemon --config runner-config.yml'

configs:
  runner_config:
    content: |
      server:
        connections:
          forgejo:
            url: ADD_HERE
            uuid: ADD_HERE
            token: ADD_HERE
      runner:
        labels:
          - ubuntu-latest:docker://node:18-bullseye
          - debian-latest:docker://debian:bullseye-slim
          - debian:docker://docker.io/library/node:lts

volumes:
  forgejo_runner_data:
    driver: local
