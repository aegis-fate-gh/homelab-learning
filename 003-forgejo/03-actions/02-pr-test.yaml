name: PR Workflow Test

on:
  pull_request:
    branches:
      - main

jobs:
  show-pr-code:
    runs-on: debian
    steps:
      - name: Checkout PR Code
        uses:  https://data.forgejo.org/actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: List files
        run: ls -la